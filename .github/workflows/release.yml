name: Android release

# Builds signed release APKs and attaches them to a GitHub release when a
# release is published (created via the GitHub web UI). The release keystore
# comes from repo secrets — it never leaves CI.
#
# Needs repo secrets: ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD.

on:
  release:
    types: [published]

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK packages
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do export PATH="$d:$PATH"; done
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          chmod 600 keystore.properties release.keystore

      - name: Install Gradle 8.9
        run: |
          curl -sSL --retry 5 --retry-all-errors -o /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version | head -8

      - name: Build signed release APKs
        run: gradle assembleRelease --console=plain --max-workers=2

      - name: Verify APK signatures (static gate)
        run: |
          for APK in app/build/outputs/apk/release/app-arm64-v8a-release.apk \
                   app/build/outputs/apk/release/app-armeabi-v7a-release.apk; do
            echo "== $APK"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "package:|native-code|launchable-activity"
          done

      - name: Attach APKs to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            --clobber
