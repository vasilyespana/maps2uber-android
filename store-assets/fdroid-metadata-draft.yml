AutoName: Maps2Uber
Summary: Google Maps pin → Uber deep links + fare probes
Description: |-
  Paste a Google Maps link and get an Uber deep link to that exact spot —
  plus 10 probe links on a 100&nbsp;m circle to compare fares and detect
  surge-zone boundaries. Real proof: $9.32 vs $11.37 for the same ride in
  Condado, San Juan — 22% saved with a one-minute walk.
  .
  Free, no ads, no accounts. Map links you submit are resolved server-side;
  see the privacy policy at https://maps2uber.vasilyespana.workers.dev/privacy.

