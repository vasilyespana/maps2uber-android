name: Android device gate

# Every PR to main must install + launch the release APK on a real
# BrowserStack physical device before it can merge. This is the automated
# enforcement of the APK quality gate: no APK is handed over without a
# passing device install/launch.
# NOTE: needs repo secrets BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY /
# ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-device-gate.yml'
      - '.github/scripts/bs_device_gate.py'

jobs:
  device-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK packages
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do export PATH="$d:$PATH"; done
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          chmod 600 keystore.properties release.keystore

      - name: Install Gradle 8.9
        run: |
          curl -sSL --retry 5 --retry-all-errors -o /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version | head -8

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --console=plain --max-workers=2

      - name: Build release APK
        run: gradle assembleRelease --console=plain --max-workers=2

      - name: Verify APK signatures (static gate)
        run: |
          for APK in app/build/outputs/apk/release/app-arm64-v8a-release.apk \
                     app/build/outputs/apk/release/app-armeabi-v7a-release.apk; do
            echo "== $APK"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "package:|native-code|launchable-activity"
          done

      - name: Upload APK to BrowserStack
        id: bs-upload
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          # BrowserStack devices are arm64 — upload the arm64 split APK.
          APP_URL=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST https://api-cloud.browserstack.com/app-automate/upload \
            -F "file=@app/build/outputs/apk/release/app-arm64-v8a-release.apk" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['app_url'])")
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded: $APP_URL"

      - name: Install + launch on a real device (BrowserStack App Automate)
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          APP_URL: ${{ steps.bs-upload.outputs.app_url }}
        run: |
          pip install --quiet Appium-Python-Client selenium
          python3 .github/scripts/bs_device_gate.py

      - name: Upload device screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-launch-screenshot
          path: /tmp/bs-launch.png
