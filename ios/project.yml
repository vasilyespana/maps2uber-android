# Map2Ride for iOS — XcodeGen project spec.
# Generate with:  xcodegen generate   (CI does this on macos-15)
# The app is built UNSIGNED (CODE_SIGNING_ALLOWED=NO): distribution is
# via SideStore (see INSTALL-FREE.md and the repo-root
# sidestore-source.json) until an Apple Developer Program membership
# exists.
name: Map2Ride
options:
  bundleIdPrefix: dev.vasilyespana
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  Map2Ride:
    type: application
    platform: iOS
    sources:
      - path: Sources/Map2Ride
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Map2Ride
        CFBundleName: Map2Ride
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: dev.vasilyespana.maps2uber
            CFBundleURLSchemes:
              - map2ride
        LSApplicationQueriesSchemes:
          - uber
          - lyft
          - bolt
          - freenow
          - grab
          - gett
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vasilyespana.maps2uber
        # Parity release train with Android: iOS 1.5.0 == Android
        # v1.5.0 provider set (Uber, Lyft, Bolt, FreeNow, Grab, Gett,
        # DiDi) plus the second-provider price-comparison setting.
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  Map2RideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Map2RideTests
    dependencies:
      - target: Map2Ride

  Map2RideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/Map2RideUITests
    dependencies:
      - target: Map2Ride

schemes:
  Map2Ride:
    build:
      targets:
        Map2Ride: all
        Map2RideTests: [test]
        Map2RideUITests: [test]
    test:
      targets:
        - Map2RideTests
        - Map2RideUITests
      gatherCoverageData: false
