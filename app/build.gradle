plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'dev.vasilyespana.maps2uber'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vasilyespana.maps2uber'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def ksProps = new Properties()
            def ksPropsFile = rootProject.file('keystore.properties')
            if (ksPropsFile.exists()) {
                ksPropsFile.withInputStream { ksProps.load(it) }
            }
            def sf = ksProps.getProperty('storeFile', System.getenv('RELEASE_STORE_FILE') ?: 'release.keystore')
            storeFile rootProject.file(sf)
            storePassword ksProps.getProperty('storePassword', System.getenv('RELEASE_STORE_PASSWORD'))
            keyAlias ksProps.getProperty('keyAlias', System.getenv('RELEASE_KEY_ALIAS') ?: 'maps2uber')
            keyPassword ksProps.getProperty('keyPassword', System.getenv('RELEASE_KEY_PASSWORD'))
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    // Per-ABI versionCodes so both splits can coexist on Play / GitHub releases.
    // (arm64 must be higher than v7a.)
    testOptions {
        unitTests {
            // Android framework calls return defaults instead of throwing
            // "not mocked" — keeps pure-JVM unit tests hermetic.
            returnDefaultValues = true
        }
    }
}

// Distinct versionCode per ABI so installers/play-style ordering prefer arm64.
def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiCodes[abi]
        }
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    // ---- Compose ----
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---- AndroidX core ----
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // ---- Location (pickup = current location) ----
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // ---- DI ----
    implementation 'com.google.dagger:hilt-android:2.55'
    kapt 'com.google.dagger:hilt-compiler:2.55'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // ---- Networking (resolve API) ----
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ---- Map (visual pins, OSM tiles — no API key) ----
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // ---- Tests ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
